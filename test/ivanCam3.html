<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Camera Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* Минимальный CSS Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Базовые стили */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
        }

        /* Сетка камер */
        .cameras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .camera-card {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .camera-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 12px;
        }

        .camera-title {
            font-size: 16px;
            font-weight: 600;
        }

        .camera-type {
            font-size: 12px;
            background: rgba(56, 189, 248, 0.2);
            padding: 4px 8px;
            border-radius: 8px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        /* Кастомные стили для инпутов и кнопок */
        .custom-input, .custom-select, .custom-button {
            appearance: none;
            border: none;
            outline: none;
            background: rgba(15, 23, 42, 0.9);
            color: #e2e8f0;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            transition: all 0.2s ease;
        }

        .custom-input:focus, .custom-select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .custom-button {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: none;
            padding: 10px 16px;
        }

        .custom-button:hover {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            transform: translateY(-1px);
        }

        .custom-button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(71, 85, 105, 0.8);
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: rgba(100, 116, 139, 0.8);
        }

        /* Форма добавления камеры */
        .add-camera-form {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #94a3b8;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 20px;
            background: rgba(22, 163, 74, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.5);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
        }

        .camera-status {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .cameras-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Camera Hub</h1>
            <!-- <p class="subtitle">Подключение локальных и IP-камер с записью через FFmpeg в браузере</p> -->
            <div class="status-indicator" id="ffmpeg-status">
                <span class="status-dot"></span>
                <span>FFmpeg: Загрузка...</span>
            </div>
        </header>

        <section class="add-camera-form">
            <h2 style="margin-bottom: 16px; font-size: 18px;">Добавить камеру</h2>
            <div class="form-group">
                <label class="form-label">Название камеры</label>
                <input type="text" id="camera-name" class="custom-input" placeholder="Например: Веб-камера офиса" style="width: 100%;">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Тип камеры</label>
                    <select id="camera-type" class="custom-select" style="width: 100%;">
                        <option value="local">Локальная камера</option>
                        <option value="ip">IP-камера</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">URL потока (для IP-камер)</label>
                    <input type="text" id="camera-url" class="custom-input" placeholder="rtsp://..." style="width: 100%;">
                </div>
                
                <button id="add-camera" class="custom-button">Добавить</button>
            </div>
        </section>

        <section>
            <h2 style="margin-bottom: 16px; font-size: 18px;">Подключенные камеры</h2>
            <div class="cameras-grid" id="cameras-container">
                <!-- Камеры будут добавляться сюда -->
            </div>
        </section>
    </div>

    <!-- Подключение FFmpeg с указанного CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.12.15/umd/ffmpeg.min.js"></script>
    
    <script>
        // Глобальные переменные
        let cameras = new Map();
        let cameraIdCounter = 1;
        let ffmpegLoaded = false;

        // Инициализация FFmpeg
        const { createFFmpeg } = FFmpeg;
        const ffmpeg = createFFmpeg({
            log: false,
            corePath: 'https://unpkg.com/@ffmpeg/core@0.12.10/dist/ffmpeg-core.js'
        });

        // Загрузка FFmpeg
        async function loadFFmpeg() {
            try {
                updateFFmpegStatus('Загрузка FFmpeg...', 'loading');
                await ffmpeg.load();
                ffmpegLoaded = true;
                updateFFmpegStatus('FFmpeg готов к работе', 'ready');
            } catch (error) {
                console.error('Ошибка загрузки FFmpeg:', error);
                updateFFmpegStatus('Ошибка загрузки FFmpeg', 'error');
            }
        }

        function updateFFmpegStatus(message, status) {
            const indicator = document.getElementById('ffmpeg-status');
            const dot = indicator.querySelector('.status-dot');
            
            indicator.querySelector('span:last-child').textContent = `FFmpeg: ${message}`;
            
            dot.style.background = 
                status === 'ready' ? '#22c55e' :
                status === 'loading' ? '#facc15' : '#ef4444';
        }

        // Управление камерами
        function createCamera(name, type, url) {
            const id = cameraIdCounter++;
            const camera = {
                id,
                name: name || `Камера ${id}`,
                type,
                url,
                stream: null,
                videoElement: null
            };

            const cameraCard = createCameraCard(camera);
            cameras.set(id, camera);
            
            document.getElementById('cameras-container').appendChild(cameraCard);
            
            // Инициализация камеры
            if (type === 'local') {
                initializeLocalCamera(camera);
            } else {
                initializeIPCamera(camera);
            }
            
            return camera;
        }

        function createCameraCard(camera) {
            const card = document.createElement('div');
            card.className = 'camera-card';
            card.innerHTML = `
                <div class="camera-header">
                    <div class="camera-title">${camera.name}</div>
                    <div class="camera-type">${camera.type === 'local' ? 'Локальная' : 'IP-камера'}</div>
                </div>
                
                <div class="video-container">
                    <video class="camera-video" autoplay playsinline muted></video>
                </div>
                
                <div class="camera-controls">
                    <button class="custom-button btn-secondary" onclick="startCamera(${camera.id})">Старт</button>
                    <button class="custom-button btn-secondary" onclick="stopCamera(${camera.id})">Стоп</button>
                    <button class="custom-button" onclick="recordClip(${camera.id})">Запись 10с</button>
                    <button class="custom-button btn-secondary" onclick="removeCamera(${camera.id})">Удалить</button>
                </div>
                
                <div class="camera-status" id="status-${camera.id}">Готов к работе</div>
            `;
            
            camera.videoElement = card.querySelector('.camera-video');
            return card;
        }

        // Работа с камерами
        async function initializeLocalCamera(camera) {
            try {
                updateCameraStatus(camera.id, 'Запрос доступа к камере...');
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720 },
                    audio: false 
                });
                
                camera.stream = stream;
                camera.videoElement.srcObject = stream;
                updateCameraStatus(camera.id, 'Камера активна');
            } catch (error) {
                console.error('Ошибка доступа к камере:', error);
                updateCameraStatus(camera.id, 'Ошибка доступа к камере');
            }
        }

        function initializeIPCamera(camera) {
            if (!camera.url) {
                updateCameraStatus(camera.id, 'URL не указан');
                return;
            }
            
            try {
                camera.videoElement.src = camera.url;
                camera.videoElement.crossOrigin = 'anonymous';
                updateCameraStatus(camera.id, 'Подключение к IP-камере...');
            } catch (error) {
                console.error('Ошибка подключения к IP-камере:', error);
                updateCameraStatus(camera.id, 'Ошибка подключения');
            }
        }

        function startCamera(id) {
            const camera = cameras.get(id);
            if (!camera) return;
            
            if (camera.type === 'local') {
                initializeLocalCamera(camera);
            } else {
                initializeIPCamera(camera);
            }
        }

        function stopCamera(id) {
            const camera = cameras.get(id);
            if (!camera) return;
            
            if (camera.stream) {
                camera.stream.getTracks().forEach(track => track.stop());
                camera.stream = null;
            }
            
            if (camera.videoElement) {
                camera.videoElement.srcObject = null;
                camera.videoElement.src = '';
            }
            
            updateCameraStatus(id, 'Поток остановлен');
        }

        function removeCamera(id) {
            const camera = cameras.get(id);
            if (!camera) return;
            
            stopCamera(id);
            cameras.delete(id);
            
            const card = document.querySelector(`[data-camera-id="${id}"]`);
            if (card) card.remove();
        }

        async function recordClip(id) {
            if (!ffmpegLoaded) {
                alert('FFmpeg еще не загружен. Подождите...');
                return;
            }
            
            const camera = cameras.get(id);
            if (!camera || !camera.videoElement) return;
            
            updateCameraStatus(id, 'Начало записи...');
            
            try {
                // Здесь будет код записи через FFmpeg
                // Это упрощенная заглушка для демонстрации
                setTimeout(() => {
                    updateCameraStatus(id, 'Запись завершена');
                }, 2000);
                
            } catch (error) {
                console.error('Ошибка записи:', error);
                updateCameraStatus(id, 'Ошибка записи');
            }
        }

        function updateCameraStatus(id, message) {
            const statusElement = document.getElementById(`status-${id}`);
            if (statusElement) {
                statusElement.textContent = message;
            }
        }

        // Обработчики событий
        document.getElementById('add-camera').addEventListener('click', () => {
            const name = document.getElementById('camera-name').value;
            const type = document.getElementById('camera-type').value;
            const url = document.getElementById('camera-url').value;
            
            if (!name.trim()) {
                alert('Введите название камеры');
                return;
            }
            
            createCamera(name, type, url);
            
            // Очистка формы
            document.getElementById('camera-name').value = '';
            document.getElementById('camera-url').value = '';
        });

        // Автоматическая загрузка FFmpeg при старте
        loadFFmpeg();

        // Добавим тестовую камеру при загрузке
        window.addEventListener('load', () => {
            // createCamera('Тестовая камера', 'local', '');
        });
    </script>
</body>
</html>
