<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FFmpeg Camera Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --warning: #d97706;
            --error: #dc2626;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 25px;
            margin-top: 15px;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .loading .status-dot { background: var(--warning); }
        .ready .status-dot { background: var(--success); }
        .error .status-dot { background: var(--error); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .panels {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .control-panel {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            height: fit-content;
        }

        .cameras-panel {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--primary);
        }

        /* Кастомные инпуты */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
        }

        .custom-input, .custom-select, .custom-button {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
            appearance: none;
        }

        .custom-input:focus, .custom-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .custom-button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            padding: 14px;
        }

        .custom-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        .custom-button:active {
            transform: translateY(0);
        }

        /* Сетка камер */
        .cameras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .camera-card {
            background: var(--bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .camera-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .camera-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
        }

        .camera-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .camera-type {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: var(--primary);
            color: white;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .device-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            background: var(--bg);
        }

        .device-item {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .device-item:hover {
            background: var(--primary-dark);
        }

        .device-item:last-child {
            border-bottom: none;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: white;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FFmpeg Camera Hub</h1>
            <p class="subtitle">Управление неограниченным количеством локальных и удалённых камер</p>
            <div class="status-indicator" id="ffmpeg-status">
                <div class="status-dot"></div>
                <span>FFmpeg: Загрузка библиотеки...</span>
            </div>
        </header>

        <div class="panels">
            <!-- Панель управления -->
            <section class="control-panel">
                <h2 class="section-title">Добавить камеру</h2>
                
                <div class="form-group">
                    <label class="form-label">Название камеры</label>
                    <input type="text" id="camera-name" class="custom-input" placeholder="Введите название камеры">
                </div>

                <div class="form-group">
                    <label class="form-label">Тип подключения</label>
                    <select id="camera-type" class="custom-select">
                        <option value="local">Локальная камера</option>
                        <option value="ip">IP-камера</option>
                    </select>
                </div>

                <div class="form-group" id="ip-url-group">
                    <label class="form-label">URL IP-камеры</label>
                    <input type="text" id="camera-url" class="custom-input" placeholder="rtsp://... или http://...">
                </div>

                <div class="form-group">
                    <label class="form-label">Выберите устройство</label>
                    <div class="device-list" id="devices-list">
                        <!-- Список устройств будет здесь -->
                    </div>
                </div>

                <button id="add-camera" class="custom-button">Добавить камеру</button>

                <div class="form-group" style="margin-top: 30px;">
                    <label class="form-label">Статус системы</label>
                    <div id="system-status">
                        <div>Обнаружено камер: <span id="cameras-count">0</span></div>
                        <div>Обнаружено микрофонов: <span id="mics-count">0</span></div>
                        <div>Всего подключено: <span id="total-connected">0</span></div>
                    </div>
                </div>
            </section>

            <!-- Панель камер -->
            <section class="cameras-panel">
                <div class="section-title">Подключенные камеры (<span id="connected-count">0</span>)</div>
                <div class="cameras-grid" id="cameras-container">
                    <!-- Карточки камер будут здесь -->
                </div>
            </section>
        </div>
    </div>

    <!-- Подключение FFmpeg с указанного CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.12.15/umd/ffmpeg.min.js"></script>
    
    <script>
        class CameraHub {
            constructor() {
                this.cameras = new Map();
                this.cameraIdCounter = 1;
                this.ffmpegLoaded = false;
                this.availableDevices = [];
                this.devicePollInterval = null;
                
                this.initializeFFmpeg();
                this.startDevicePolling();
                this.setupEventListeners();
            }

            async initializeFFmpeg() {
                try {
                    this.updateFFmpegStatus('Инициализация FFmpeg...', 'loading');
                    
                    if (typeof FFmpeg === 'undefined') {
                        throw new Error('FFmpeg библиотека не загружена');
                    }

                    const { createFFmpeg } = FFmpeg;
                    this.ffmpeg = createFFmpeg({
                        log: false,
                        corePath: 'https://unpkg.com/@ffmpeg/core@0.12.10/dist/ffmpeg-core.js'
                    });

                    await this.ffmpeg.load();
                    this.ffmpegLoaded = true;
                    this.updateFFmpegStatus('FFmpeg готов к работе', 'ready');
                    
                } catch (error) {
                    console.error('Ошибка инициализации FFmpeg:', error);
                    this.updateFFmpegStatus('Ошибка загрузки FFmpeg', 'error');
                }
            }

            updateFFmpegStatus(message, status) {
                const indicator = document.getElementById('ffmpeg-status');
                indicator.className = `status-indicator ${status}`;
                indicator.querySelector('span').textContent = `FFmpeg: ${message}`;
            }

            async scanDevices() {
                try {
                    if (!navigator.mediaDevices?.enumerateDevices) return;
                    
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    this.availableDevices = devices.filter(device => 
                        device.kind === 'videoinput' || device.kind === 'audioinput'
                    );
                    
                    this.updateDevicesList();
                    this.updateSystemStatus();
                    
                } catch (error) {
                    console.error('Ошибка сканирования устройств:', error);
                }
            }

            updateDevicesList() {
                const list = document.getElementById('devices-list');
                const videoDevices = this.availableDevices.filter(d => d.kind === 'videoinput');
                
                list.innerHTML = videoDevices.map(device => `
                    <div class="device-item" data-device-id="${device.deviceId}">
                        ${device.label || `Камера ${device.deviceId.slice(0, 8)}`}
                    </div>
                `).join('');

                // Добавляем обработчики для выбора устройств
                list.querySelectorAll('.device-item').forEach(item => {
                    item.addEventListener('click', () => {
                        list.querySelectorAll('.device-item').forEach(i => i.style.background = '');
                        item.style.background = 'var(--primary-dark)';
                    });
                });
            }

            updateSystemStatus() {
                const videoDevices = this.availableDevices.filter(d => d.kind === 'videoinput');
                const audioDevices = this.availableDevices.filter(d => d.kind === 'audioinput');
                
                document.getElementById('cameras-count').textContent = videoDevices.length;
                document.getElementById('mics-count').textContent = audioDevices.length;
                document.getElementById('total-connected').textContent = this.cameras.size;
                document.getElementById('connected-count').textContent = this.cameras.size;
            }

            startDevicePolling() {
                // Первоначальное сканирование
                this.scanDevices();
                
                // Периодический опрос каждые 5 секунд
                this.devicePollInterval = setInterval(() => {
                    this.scanDevices();
                }, 5000);
            }

            setupEventListeners() {
                document.getElementById('add-camera').addEventListener('click', () => this.addCamera());
                
                document.getElementById('camera-type').addEventListener('change', (e) => {
                    document.getElementById('ip-url-group').style.display = 
                        e.target.value === 'ip' ? 'block' : 'none';
                });
            }

            async addCamera() {
                const name = document.getElementById('camera-name').value || `Камера ${this.cameraIdCounter}`;
                const type = document.getElementById('camera-type').value;
                const url = type === 'ip' ? document.getElementById('camera-url').value : '';
                
                const camera = {
                    id: this.cameraIdCounter++,
                    name,
                    type,
                    url,
                    stream: null,
                    videoElement: null,
                    status: 'initializing'
                };

                this.createCameraCard(camera);
                this.cameras.set(camera.id, camera);

                try {
                    if (type === 'local') {
                        await this.initializeLocalCamera(camera);
                    } else {
                        await this.initializeIPCamera(camera);
                    }
                } catch (error) {
                    console.error(`Ошибка инициализации камеры ${camera.id}:`, error);
                    this.updateCameraStatus(camera.id, 'Ошибка инициализации');
                }

                this.updateSystemStatus();
                
                // Очистка формы
                document.getElementById('camera-name').value = '';
                document.getElementById('camera-url').value = '';
            }

            createCameraCard(camera) {
                const container = document.getElementById('cameras-container');
                const card = document.createElement('div');
                card.className = 'camera-card';
                card.innerHTML = `
                    <div class="camera-header">
                        <div class="camera-title">${camera.name}</div>
                        <div class="camera-type">${camera.type === 'local' ? 'Локальная' : 'IP'}</div>
                    </div>
                    
                    <div class="video-container">
                        <video class="camera-video" autoplay playsinline muted></video>
                        <div class="loading-overlay" id="loading-${camera.id}">
                            <div class="spinner"></div>
                            <div style="margin-left: 10px;">Подключение...</div>
                        </div>
                    </div>
                    
                    <div class="camera-controls">
                        <button class="custom-button btn-small" onclick="app.startCamera(${camera.id})">Старт</button>
                        <button class="custom-button btn-small" onclick="app.stopCamera(${camera.id})">Стоп</button>
                        <button class="custom-button btn-small" onclick="app.recordClip(${camera.id})">Запись</button>
                        <button class="custom-button btn-small" onclick="app.removeCamera(${camera.id})">Удалить</button>
                    </div>
                    
                    <div style="margin-top: 10px; font-size: 0.9rem; color: var(--text-muted);" id="status-${camera.id}">
                        Инициализация...
                    </div>
                `;

                container.appendChild(card);
                camera.videoElement = card.querySelector('.camera-video');
                return card;
            }

            async initializeLocalCamera(camera) {
                try {
                    this.updateCameraStatus(camera.id, 'Запрос доступа к камере...');
                    
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { 
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: false
                    });
                    
                    camera.stream = stream;
                    camera.videoElement.srcObject = stream;
                    this.hideLoading(camera.id);
                    this.updateCameraStatus(camera.id, 'Камера активна');
                    
                } catch (error) {
                    this.updateCameraStatus(camera.id, 'Ошибка доступа к камере');
                    throw error;
                }
            }

            async initializeIPCamera(camera) {
                if (!camera.url) {
                    this.updateCameraStatus(camera.id, 'URL не указан');
                    return;
                }

                try {
                    this.updateCameraStatus(camera.id, 'Подключение к IP-камере...');
                    
                    // Для IP-камер используем стандартный video src
                    camera.videoElement.src = camera.url;
                    camera.videoElement.crossOrigin = 'anonymous';
                    
                    camera.videoElement.onloadeddata = () => {
                        this.hideLoading(camera.id);
                        this.updateCameraStatus(camera.id, 'IP-камера подключена');
                    };
                    
                    camera.videoElement.onerror = () => {
                        this.updateCameraStatus(camera.id, 'Ошибка подключения к IP-камере');
                    };
                    
                } catch (error) {
                    this.updateCameraStatus(camera.id, 'Ошибка подключения');
                    throw error;
                }
            }

            hideLoading(cameraId) {
                const loading = document.getElementById(`loading-${cameraId}`);
                if (loading) loading.style.display = 'none';
            }

            updateCameraStatus(cameraId, message) {
                const statusElement = document.getElementById(`status-${cameraId}`);
                if (statusElement) {
                    statusElement.textContent = message;
                }
            }

            startCamera(id) {
                const camera = this.cameras.get(id);
                if (!camera) return;

                if (camera.type === 'local') {
                    this.initializeLocalCamera(camera);
                } else {
                    this.initializeIPCamera(camera);
                }
            }

            stopCamera(id) {
                const camera = this.cameras.get(id);
                if (!camera) return;

                if (camera.stream) {
                    camera.stream.getTracks().forEach(track => track.stop());
                    camera.stream = null;
                }

                if (camera.videoElement) {
                    camera.videoElement.srcObject = null;
                    camera.videoElement.src = '';
                }

                this.updateCameraStatus(id, 'Поток остановлен');
            }

            removeCamera(id) {
                this.stopCamera(id);
                this.cameras.delete(id);
                
                const card = document.querySelector(`[data-camera-id="${id}"]`);
                if (card) card.remove();
                
                this.updateSystemStatus();
            }

            async recordClip(id) {
                if (!this.ffmpegLoaded) {
                    alert('FFmpeg еще не загружен. Подождите...');
                    return;
                }

                const camera = this.cameras.get(id);
                if (!camera || !camera.videoElement) return;

                this.updateCameraStatus(id, 'Начало записи...');

                try {
                    // Здесь будет реализация записи через FFmpeg
                    await new Promise(resolve => setTimeout(resolve, 2000)); // Имитация записи
                    this.updateCameraStatus(id, 'Запись завершена');
                } catch (error) {
                    console.error('Ошибка записи:', error);
                    this.updateCameraStatus(id, 'Ошибка записи');
                }
            }
        }

        // Инициализация приложения
        let app;
        window.addEventListener('load', () => {
            app = new CameraHub();
        });
    </script>
</body>
</html>
